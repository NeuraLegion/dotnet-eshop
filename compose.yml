services:
  orderingdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourWeak(!)Password
      POSTGRES_DB: OrderingDB
      PGDATA: /var/lib/postgresql/data
    volumes:
      - orderingdb-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  eventbus:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  orderingapi:
    build:
      context: .
      dockerfile: Dockerfile.bright
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      PORT: "8080"
      ConnectionStrings__OrderingDB: Host=orderingdb;Database=OrderingDB;Username=postgres;Password=yourWeak(!)Password
      ConnectionStrings__EventBus: amqp://guest:guest@eventbus:5672/
      EventBus__SubscriptionClientName: Ordering
      Identity__Audience: orders
      Identity__Scopes__orders: Ordering API
      Security__DisableAuthentication: "true"
    ports:
      - "8080:8080"
    depends_on:
      orderingdb:
        condition: service_healthy
      eventbus:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  orderingdb-data:
